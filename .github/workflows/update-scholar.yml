name: Update Scholar Statistics

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_scholar.py"
      - "tests/test_update_scholar.py"
      - ".github/workflows/update-scholar.yml"

permissions:
  contents: write

concurrency:
  group: scholar-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser and failure handling
        run: python -m unittest discover -s tests -p 'test_update_scholar.py'
      - name: Fetch public profile metrics
        run: python scripts/update_scholar.py --author-id y5FkC7cAAAAJ --output "$RUNNER_TEMP/scholar.json"
      - name: Publish only to the statistics branch
        shell: bash
        run: |
          set -euo pipefail
          branch=google-scholar-stats
          directory="$RUNNER_TEMP/scholar-data"
          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_ref" ]; then
            git fetch origin "$branch"
            git worktree add --detach "$directory" FETCH_HEAD
          else
            git worktree add --detach "$directory" HEAD
            git -C "$directory" checkout --orphan "$branch"
            git -C "$directory" rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/scholar.json" "$directory/scholar.json"
          git -C "$directory" config user.name "github-actions[bot]"
          git -C "$directory" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$directory" add scholar.json
          if ! git -C "$directory" diff --cached --quiet; then
            git -C "$directory" commit -m "Refresh Google Scholar statistics"
            git -C "$directory" push origin "HEAD:refs/heads/$branch"
          fi
